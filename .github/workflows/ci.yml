name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    name: Test Python ${{ matrix.python-version }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check ergane/ tests/ --output-format=github

      - name: Type check with mypy
        run: mypy ergane/ --ignore-missing-imports || true

      - name: Test with pytest
        run: pytest tests/ -v --tb=short

      - name: CLI smoke test
        run: |
          ergane --version
          ergane --help
          ergane scan --since HEAD~1 --dry-run
          ergane analyze

  ergane-scan:
    runs-on: ubuntu-latest
    name: Ergane Patent Scan
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ergane
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Run Ergane scan
        run: ergane scan --since HEAD~5 --dry-run

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: ergane-state
          path: .github/ergane-state.md
          if-no-files-found: ignore
