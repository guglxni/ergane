name: ergane

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ergane-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  scan:
    # Private source is never sent to external services unless the repository
    # owner explicitly opts in through an Actions variable.
    if: github.event.repository.private == false || vars.ERGANE_ALLOW_PRIVATE_REPOS == 'true'
    runs-on: ubuntu-latest
    name: Ergane Patent Scan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          # PR scans compare against the remote base branch, which must exist
          # locally for GitPython to resolve `origin/<base>` safely.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5.4.0
        with:
          version: "0.9.25"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Run Ergane Scan
        env:
          ERGANE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ERGANE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERGANE_MODEL: "gpt-5.6-sol"
          ERGANE_NOVELTY_THRESHOLD: "0.4"
          ERGANE_NOTIFICATION_THRESHOLD: "0.7"
          ERGANE_ALLOW_PRIVATE_REPOS: ${{ vars.ERGANE_ALLOW_PRIVATE_REPOS || 'false' }}
        run: |
          # Scan commits since PR base or last tag
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run ergane scan --since "origin/${{ github.base_ref }}" --to "HEAD" --repo . --notify --pr ${{ github.event.number }} --repo-slug ${{ github.repository }}
          else
            if git rev-parse --verify HEAD~5 >/dev/null 2>&1; then
              since_ref="HEAD~5"
            else
              since_ref="HEAD"
            fi
            uv run ergane scan --since "$since_ref" --to "HEAD" --repo . --dry-run
          fi

      - name: Upload State
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ergane-state
          path: |
            .github/ergane-state.md
            .github/ergane-audit.ndjson
          retention-days: 7
          if-no-files-found: ignore
