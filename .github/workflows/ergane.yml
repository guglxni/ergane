name: ergane
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Ergane Patent Scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ergane
        run: |
          pip install -e ".[dev]"

      - name: Run Ergane Scan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERGANE_MODEL: "gpt-5.6-sol"
          ERGANE_NOVELTY_THRESHOLD: "0.4"
        run: |
          # Scan commits since PR base or last tag
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ergane scan --since "origin/${{ github.base_ref }}" --to "HEAD" --repo . --notify --pr ${{ github.event.number }} --repo-slug ${{ github.repository }}
          else
            ergane scan --since "HEAD~5" --to "HEAD" --repo . --dry-run
          fi

      - name: Upload State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ergane-state
          path: .github/ergane-state.md
          if-no-files-found: ignore

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/ergane-state.md';
            if (fs.existsSync(path)) {
              const body = fs.readFileSync(path, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `:brain: **Ergane Patent Scan Complete**\n\n\`\`\`markdown\n${body}\n\`\`\``
              });
            }
