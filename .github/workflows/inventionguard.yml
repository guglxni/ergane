name: InventionGuard Scan
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  inventionguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install InventionGuard
        run: pip install inventionguard

      - name: Install Coral
        run: |
          curl -fsSL https://withcoral.com/install.sh | sh
          coral source add --file coral_sources/uspto.yaml || true
          coral source add --file coral_sources/epo.yaml || true
          coral source add --file coral_sources/local_patents.yaml || true

      - name: Run InventionGuard scan
        id: scan
        run: |
          patentguard scan --since ${{ github.event.before || 'HEAD~1' }} --to ${{ github.sha }} --json > inventionguard_report.json || true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCLAW_WEBHOOK_URL: ${{ secrets.OPENCLAW_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventionguard-report
          path: inventionguard_report.json

      - name: Open GitHub Issue for detected inventions
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          const path = 'inventionguard_report.json';
          if (!fs.existsSync(path)) { process.exit(0); }
          const raw = fs.readFileSync(path, 'utf8');
          if (!raw.trim()) { process.exit(0); }
          let results;
          try { results = JSON.parse(raw); } catch (e) { process.exit(0); }
          if (!Array.isArray(results) || results.length === 0) { process.exit(0); }
          const { Octokit } = require('@octokit/rest');
          const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          async function main() {
            for (const r of results) {
              const detection = r.detection || {};
              const synthesis = r.synthesis || {};
              const title = '\ud83e\udde0 Potential Invention Detected: ' + (detection.technical_problem?.substring(0, 80) || 'Unknown');
              const body = '> Disclaimer: This tool identifies potential technical inventions. It does not provide legal advice. Consult a patent attorney. AI cannot be a co-inventor.\n\n**Commit:** ' + r.commit_hash + '\n**Novelty Score:** ' + detection.novelty_score + ' (' + detection.novelty_assessment + ')\n**Risk Assessment:** ' + synthesis.risk_assessment + '\n**Similarity Score:** ' + synthesis.overall_similarity_score + '%\n**Closest Prior Art:** ' + (synthesis.closest_patent?.patent_number || 'N/A') + ' — ' + (synthesis.closest_patent?.title || 'N/A') + '\n\n## Draft Independent Claim\n> ' + (synthesis.draft_independent_claim || 'N/A') + '\n\n## Recommendation\n' + (synthesis.recommendation || 'N/A');
              await octokit.rest.issues.create({ owner, repo, title, body, labels: ['inventionguard', 'patent-review'] });
            }
          }
          main().catch(() => process.exit(0));
          "
